name: dbt

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  duckdb:
    name: parse, build, checkpoint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: make install

      - name: dbt parse
        run: make dbt-parse

      - name: dbt build
        run: make dbt-build

      - name: dbt-checkpoint
        run: make dbt-checkpoint
