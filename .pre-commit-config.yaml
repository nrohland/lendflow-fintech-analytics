# The manifest is gitignored. The first hook parses so the checkpoint hooks
# read descriptions from this commit, not from a stale target/manifest.json.
repos:
  - repo: local
    hooks:
      - id: dbt-parse
        name: dbt parse
        entry: make
        args: ["dbt-parse"]
        language: system
        pass_filenames: false
        files: ^transform/(models|macros)/
  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v2.0.10
    hooks:
      - id: check-model-has-description
        args: ["--config", "transform/.dbt-checkpoint.yaml"]
        files: ^transform/models/.*\.(sql|yml)$
      - id: check-model-columns-have-desc
        args: ["--config", "transform/.dbt-checkpoint.yaml"]
        files: ^transform/models/.*\.(sql|yml)$
      - id: check-model-has-properties-file
        args: ["--config", "transform/.dbt-checkpoint.yaml"]
        files: ^transform/models/.*\.sql$
      - id: check-script-semicolon
        args: ["--config", "transform/.dbt-checkpoint.yaml"]
        files: ^transform/(models|macros)/.*\.sql$
      - id: check-script-has-no-table-name
        args: ["--config", "transform/.dbt-checkpoint.yaml"]
        files: ^transform/models/.*\.sql$
      - id: check-model-has-tests
        args: ["--config", "transform/.dbt-checkpoint.yaml", "--test-cnt", "1"]
        files: ^transform/models/.*\.sql$
      - id: check-source-table-has-description
        args: ["--config", "transform/.dbt-checkpoint.yaml"]
        files: ^transform/models/sources\.yml$
