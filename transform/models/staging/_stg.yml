version: 2

models:
  - name: stg_applicants
    description: Staged applicant attributes. One row per person.
    columns:
      - name: applicant_id
        description: Surrogate person key.
        data_tests:
          - unique
          - not_null
      - name: created_at
        description: >
          When the person record was created. returning_user is true when
          this is at least 30 days before the first in-window application.
        data_tests:
          - not_null
      - name: returning_user
        description: >
          True when the person record was created at least 30 days before
          their first in-window application. Not a count of applications.

  - name: stg_applications
    description: Staged applications. One row per application.
    columns:
      - name: application_id
        description: Surrogate key. One row per application.
        data_tests:
          - unique
          - not_null
      - name: applicant_id
        description: Person who started this application.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_applicants')
                field: applicant_id
      - name: started_at
        description: When the application started. This is the start of the submit clock.
        data_tests:
          - not_null
      - name: application_status
        description: Furthest lifecycle state reached.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - started
                  - personal_info_completed
                  - bank_connection_started
                  - bank_connected
                  - identity_verified
                  - submitted
                  - approved
                  - referred
                  - declined
                  - vehicle_selected
                  - contracted
                  - funded
      - name: underwriting_path
        description: auto or manual once a decision exists. Null before that.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - auto
                  - manual
      - name: experiment_variant
        description: bank_connection_clarity arm on the application. control or treatment.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - control
                  - treatment

  - name: stg_events
    description: Staged product events. One row per event.
    columns:
      - name: event_id
        description: Surrogate key. One row per product event.
        data_tests:
          - unique
          - not_null
      - name: application_id
        description: Application this event belongs to.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_applications')
                field: application_id
      - name: applicant_id
        description: Person on the event. Matches the application.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_applicants')
                field: applicant_id
      - name: event_timestamp
        description: When the event was recorded. Timestamps on one application increase.
        data_tests:
          - not_null
      - name: event_name
        description: Product event name from the analytical spec. No extra names in this version.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - application_started
                  - personal_info_completed
                  - bank_connection_started
                  - bank_connection_failed
                  - bank_connected
                  - identity_verification_started
                  - identity_verification_failed
                  - identity_verified
                  - application_submitted
                  - underwriting_started
                  - manual_review_started
                  - decision_approved
                  - decision_declined
                  - decision_referred
                  - vehicle_selected
                  - contract_started
                  - contract_signed
                  - funding_started
                  - loan_funded

  - name: stg_underwriting_decisions
    description: One terminal decision per decided application. No second decision.
    columns:
      - name: application_id
        description: Decided application. One terminal decision and no second decision.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_applications')
                field: application_id
      - name: decision
        description: Terminal outcome. approved, referred, or declined.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - approved
                  - referred
                  - declined
      - name: decision_path
        description: auto or manual. Matches the application underwriting_path once a decision exists.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - auto
                  - manual
      - name: decision_timestamp
        description: When the terminal decision was recorded.
        data_tests:
          - not_null
      - name: decision_duration_minutes
        description: decision_timestamp minus submitted_at, in minutes.
        data_tests:
          - not_null
      - name: risk_band
        description: Synthetic segment stored on the decision. Not a credit score.
        data_tests:
          - not_null

  - name: stg_funding_events
    description: One row per approved application, funded or not.
    columns:
      - name: application_id
        description: Approved application. A row exists only when the decision is approved.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_applications')
                field: application_id
      - name: funding_status
        description: funded or not_funded. Referred and declined applications are not in this table.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - funded
                  - not_funded

  - name: stg_experiments
    description: Assignment at application start for bank_connection_clarity.
    columns:
      - name: application_id
        description: Application that received the assignment at start.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_applications')
                field: application_id
      - name: experiment_name
        description: Experiment identifier. This version assigns bank_connection_clarity only.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - bank_connection_clarity
      - name: variant
        description: Assigned arm. control or treatment.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - control
                  - treatment
      - name: assigned_at
        description: When the arm was assigned. Equal to the application started_at.
        data_tests:
          - not_null
