      result: pass
      evidence: >
        dbt 1.12.5, dbt-duckdb 1.11.0, duckdb 1.4.4.
        dbt build --project-dir transform --profiles-dir transform
        --vars "{parquet_root: /workspace/data/synthetic}"
        finished PASS=110 WARN=0 ERROR=0 SKIP=0 TOTAL=110.
        15 models, 94 data tests, 1 on-run-start hook.
    - id: uniqueness
      result: pass
      evidence: >
        unique tests on applicant, application, event, decision, funding,
        and experiment assignment keys. assert_composite_unique_keys passed
        for the funnel grain, product_metrics grain, and experiment metric name.
    - id: relationships
      result: pass
      evidence: >
        relationship tests from applications to applicants, events to
        applications and applicants, decisions, funding, and experiments
        to applications, and marts back to fct_applications.
    - id: lifecycle_ordering
      result: pass
      evidence: >
        assert_lifecycle_timestamp_order, assert_no_contract_before_submission,
        assert_no_funding_before_approval, assert_bank_connected_implies_started,
        assert_status_matches_furthest_stage, assert_canonical_clocks,
        assert_underwriting_path, and assert_decision_duration_matches_delta passed.
    - id: experiment_integrity
      result: pass
      evidence: >
        assert_experiment_integrity passed. One bank_connection_clarity row
        per application, variant in {control, treatment}, assigned_at equals
        started_at. fct_experiment_results has 6 metrics. Primary population
        is applications with bank_connection_started (35016 control, 35111 treatment).
    - id: funnel_fact_reconcile
      result: pass
      evidence: >
        assert_funnel_fact_reconcile and assert_metric_identities passed.
        Overall counts agree across fct_applications, fct_application_funnel,
        and product_metrics: started 100000, submitted 45692, approved 22351,
        funded 13065. Bank connection started 70127 and bank connected 56036.
        Approved + referred + declined = decided, and auto + manual = decided, on every slice.
    - id: mart_export
      result: pass
      evidence: >
        scripts/export_marts.py wrote data/marts (gitignored).
        fct_applications=100000, fct_application_funnel=1400000,
        fct_underwriting=45692, fct_funding=22351,
        fct_experiment_results=6, product_metrics=8153.
        metrics.json includes the compiled mart SQL. product_decision is null.
    - id: no_dashboard
      result: pass
      evidence: no apps/ tree and no Ask LendFlow UI
    - id: no_spoiler_labels
      result: pass
      evidence: >
        New models do not name a segment, channel, period, or ship decision
        as a conclusion. device_browser and started_week are cuts.
        null_rejected_at_alpha is the alpha 0.05 test result, not a recommendation.
    - id: no_real_lender_names
      result: pass
      evidence: no new-file match for a real lender or network name in transform/, docs/dbt.md, or the task yaml
    - id: no_bot_display_names
      result: pass
      evidence: role ids only
    - id: architecture_untouched
      result: pass
      evidence: docs/architecture.md and docs/adr were not modified. architecture.impacted is false.
    - id: draft_pr_open
      result: pending
      evidence: draft pull request URL recorded after open
