gaps:
  - Decision SLA and funding SLA still have no numeric threshold. Attainment is not in the marts. median_funding_duration_hours is the contract-to-fund clock, not an attainment percent.
  - Guardrail equivalence margins are unset. null_rejected_at_alpha is only the two-sided test at alpha 0.05. On this build the approval_rate difference is 0.011 with p-value 0.018, so that flag is true for the approval guardrail. It is not a pass or fail of the guardrail, and it is not a ship decision.
  - The median guardrail interval uses a normal approximation to the median's standard error. It is not the two-proportion z-test. test_method records that.
  - Wald intervals are what the spec locks. They collapse when a proportion is 0 or 1.
  - EDA has not been run. The marts expose cuts (device_browser, channel, week, underwriting_path, variant) and do not name a finding.
  - The dashboard and Ask LendFlow are later contracts. metrics.json leaves product_decision null.
  - referred stays a terminal outcome. No second decision.
  - Applications are still treated as independent. About 4,000 are a second in-window application.
  - No CI workflow exists on main, so dbt build ran locally.
