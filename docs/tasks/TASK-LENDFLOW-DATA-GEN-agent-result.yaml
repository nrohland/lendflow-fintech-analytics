version: "1.0"
task_id: TASK-LENDFLOW-DATA-GEN
role: builder
status: draft_pr_open
summary: >
  Deterministic synthetic generator for 100,000 applications, six Parquet
  tables, and a DuckDB sanity check. No dashboard, no dbt marts.
  Architecture was not changed.
repo: nrohland/lendflow-fintech-analytics
base_sha: 0b00b7cbe0975c0d477a6b9525bb59f927ef1d66
isolate:
