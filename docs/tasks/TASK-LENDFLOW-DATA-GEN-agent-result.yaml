verify:
  checks:
    - id: sanity_script
      result: pass
      evidence: >
        python scripts/check_synthetic_data.py exited 0.
        45 checks passed, 0 failed. Report data/synthetic/sanity_report.json.
    - id: uniqueness
      result: pass
      evidence: uniqueness checks on applicants, applications, events, decisions, funding, and experiment assignment
    - id: fk_integrity
      result: pass
      evidence: fk.* checks, including event attributes copied from the application
    - id: timestamp_ordering
      result: pass
      evidence: strictly increasing event timestamps, stage order, canonical clocks, no contract before submission
    - id: no_funding_before_approval
      result: pass
      evidence: funding.only_after_approval, funding.row_iff_approved, funding.duration_and_timestamp
    - id: valid_experiment_assignment
      result: pass
      evidence: >
        one bank_connection_clarity row per application, variant in {control, treatment},
        assigned_at equals started_at, application variant matches
    - id: seeded_patterns
      result: pass
      evidence: >
        Mobile Safari bank-completion gap 0.409 (control) and 0.311 (treatment) versus mobile Chrome.
        social_prospecting is the largest channel; submission gap versus other channels 0.348;
        approved-to-funded gap 0.284; approval gap 0.0002.
        Manual share of decisions 0.120; share of decisions over 24 hours that are manual 0.866.
        Late minus early approval 0.098; early minus late approved-to-funded 0.137;
        late minus early funding rate -0.005; treatment share early 0.502 vs late 0.499.
        Tablet identity success gap 0.311 and completer-duration ratio 5.15.
        Treatment minus control bank completion 0.116; approval absolute difference 0.011;
        identity-failure absolute difference 0.002; relative median time-to-submit difference 0.002.
    - id: determinism
      result: pass
      evidence: >
        Two generations to separate directories were byte-identical to each other and to
        data/synthetic (parquet and manifest.json). Seed 20260921.
        numpy 2.2.6, pandas 2.3.3, pyarrow 21.0.0, duckdb 1.4.4, Python 3.12.3.
    - id: row_count
      result: pass
      evidence: applications=100000, inside the documented 98000-102000 band
    - id: no_dashboard_or_dbt
      result: pass
      evidence: no apps/ tree and no transform/dbt files added
    - id: no_real_lender_names
      result: pass
      evidence: no new-file match for a real lender name in scripts, docs/data-generation.md, or the task yaml
    - id: no_bot_display_names
      result: pass
      evidence: role ids only; no bot display names added in the generator, docs, or task files
    - id: architecture_untouched
      result: pass
      evidence: docs/architecture.md and docs/adr were not modified. architecture.impacted is false.
    - id: draft_pr_open
      result: pending
      evidence: recorded after the draft pull request is opened
