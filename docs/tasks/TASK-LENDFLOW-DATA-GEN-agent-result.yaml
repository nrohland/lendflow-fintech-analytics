gaps:
  - Decision SLA and funding SLA still have no numeric threshold. The 24-hour cut in the checker is not a product SLA.
  - Guardrail equivalence margins are unset. The checker records gaps. It does not score a guardrail pass or fail for a ship decision.
  - EDA has not been run. The seeded processes are generator inputs, not findings.
  - dbt marts, the dashboard, and Ask LendFlow are later contracts.
  - referred stays a terminal outcome. No second decision.
  - 4,000 applications are a second in-window application. The spec still treats rows as independent.
  - An unfinished bank connection or identity verification always has a failure event. There is no silent drop inside those stages.
  - No CI workflow exists on main, so these checks ran locally.
