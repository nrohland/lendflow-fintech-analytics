    - id: dbt_build
      result: pass
      evidence: >
        After the wiring, dbt 1.12.5 and dbt-duckdb 1.11.0.
        make dbt-build finished PASS=110 WARN=0 ERROR=0 SKIP=0 NO-OP=0 REUSED=0 TOTAL=110.
        15 models, 94 data tests, 1 on-run-start hook. 6.15s.
    - id: dbt_checkpoint
      result: pass
      evidence: >
        pre-commit 4.6.2, dbt-checkpoint v2.0.10.
        make dbt-checkpoint parsed, then all six hooks passed.
        Clearing the stg_experiments description and re-parsing failed
        check-model-has-description. The description was restored and parsed again.
        transform/.dbt-checkpoint.yaml sets disable-tracking true. The hook
        environment read that flag as True.
    - id: dbt_doctor
      result: pass
      evidence: >
        dbt-doctor 0.3.4, Node 22.14.0, --offline --preset default --lint
        --manifest target/manifest.json --fail-on none.
        make dbt-doctor exited 0. Score 80. 4 errors, 8 warnings.
        Errors are no-select-star (2) and rejoining-upstream-concepts (2).
    - id: dbt_osmosis
      result: hold
      evidence: >
        dbt-osmosis 1.5.0 in a throwaway venv next to dbt-core 1.12.5 and
        dbt-duckdb 1.11.0. analyze docs reported 0/58 columns documented.
        The dbt manifest has descriptions on 18 of those 58. yaml document
        --dry-run failed to introspect read_parquet sources and was not applied.
        Not added to requirements.txt.
    - id: reviewer_skill
      result: pass
      evidence: >
        dbt-labs/dbt-agent-skills a8607fc02a67 does not publish dbt-reviewer
        or dbt-model-reviewer. independent-reviewer is documented to load
        skill id dbt-model-review (starter pack eb71c0912ee9) on diffs under
        transform/models or transform/tests.
    - id: no_dashboard
      result: pass
      evidence: no apps/ tree and no Ask LendFlow UI
    - id: no_real_lender_names
      result: pass
      evidence: no new-file match for a real lender name
    - id: no_bot_display_names
      result: pass
      evidence: role ids only
    - id: architecture_untouched
      result: pass
      evidence: docs/architecture.md and docs/adr were not modified. architecture.impacted is false.
    - id: packages_yml_absent
      result: pass
      evidence: no packages.yml. None of the four tools is a Hub package.
