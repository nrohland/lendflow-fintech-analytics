  head: feat/lendflow-dbt-tooling-trial
gaps:
  - 40 of 58 declared YAML columns still have no description. Column-completeness hooks and an osmosis rewrite were left off on purpose.
  - dbt-doctor rejoining-upstream-concepts flags any two parents that share source synthetic. fct_applications and product_metrics trip it. The default scan is advisory (--fail-on none).
  - An absolute --manifest path is joined onto transform/ and the graph rules are skipped. The Makefile passes target/manifest.json.
  - dbt-osmosis DocumentationChecker drops column descriptions when the column object is not a dict. On dbt 1.12.5 that reported 0/58 against 18 real descriptions.
  - Source introspection failed on meta.external_location read_parquet calls. describe read_parquet(...) is a parser error.
  - dbt-doctor does not see the dbt version because requirements.txt is at the repository root, not inside transform/.
  - pre-commit install is not part of make install. A clean clone has no manifest until make dbt-parse or make dbt-build.
  - No CI workflow runs these checks.
  - Decision SLA, funding SLA, and guardrail margins are unchanged from TASK-LENDFLOW-DBT.
  - EDA, the dashboard, and Ask LendFlow remain later contracts.
