gaps:
  - Decision SLA and funding SLA have no numeric threshold.
  - Guardrail equivalence margins are unset. The spec reports intervals and does not score pass/fail.
  - Seed integer, effect sizes, channel names, and risk_band levels are generator-contract parameters.
  - Seeded signals are intents. EDA has not been run, so none of them are findings.
  - Ask LendFlow answers are not written. They wait on the marts.
  - Archify visualReview remains pending. Screenshot reading covered three of four captures.
  - Referred-as-terminal is an assumption EDA may overturn. The primary denominator is not.
  - No CI on this repository was run, because none exists on main.
